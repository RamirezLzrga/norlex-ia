services:
  - type: web
    name: norlex-ia
    runtime: python
    plan: starter          # el plan free se suspende a los 15 min de inactividad
    region: oregon
    branch: main
    healthCheckPath: /health
    # Render inyecta $PORT y reintenta si falla el arranque.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 65
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: GROQ_API_KEY
        sync: false          # se configura en el panel de Render
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: NORLEX_IA_SHARED_SECRET
        generateValue: true  # Render genera el secreto
      - key: NORLEX_IA_SIGNATURE_TTL
        value: "300"

      # ── Base de datos ──
      # OJO: SQL Server no esta disponible en Render. Tienes que apuntar a una
      # instancia accesible desde internet (Azure SQL, tu servidor con IP
      # publica, o un tunel). Con Windows Auth esto NO funciona.
      - key: NORLEX_DB_SERVER
        sync: false
      - key: NORLEX_DB_NAME
        value: BD_Fed
      - key: NORLEX_DB_USER
        sync: false
      - key: NORLEX_DB_PASSWORD
        sync: false

      # En produccion esto debe ser false: permite pedir cualquier rol sin firma.
      - key: NORLEX_IA_DEMO
        value: "false"
      - key: NORLEX_IA_ALLOW_ANONYMOUS
        value: "false"
